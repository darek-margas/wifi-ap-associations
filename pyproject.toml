[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wifi-ap-associations"
dynamic = ["version"]
description = "Read which Wi-Fi clients are associated to an access point (D-Link DAP, OpenWrt, UniFi), with signal, band and the AP's own health."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Darek Margas" }]
requires-python = ">=3.12"
dependencies = ["asyncssh>=2.14.2"]
keywords = ["wifi", "access point", "presence", "openwrt", "d-link", "unifi", "home assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

[project.scripts]
wifi-ap-collect = "wifi_ap_associations.collect:main"
wifi-ap-probe = "wifi_ap_associations.probe:main"

[project.urls]
Homepage = "https://github.com/darek-margas/wifi-ap-associations"
Issues = "https://github.com/darek-margas/wifi-ap-associations/issues"
"Used by" = "https://github.com/darek-margas/wifi-association-presence"

[tool.hatch.version]
path = "src/wifi_ap_associations/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/wifi_ap_associations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
